<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D City Map — Portfolio</title>
<style>
:root {
--bg: #f0f4f8;
--panel: #ffffff;
--text: #1a2233;
--muted: #7a8898;
--accent: #2e8fe0;
--shadow: 0 8px 24px rgba(26, 34, 51, 0.12);
--radius: 16px;
--panel-w: 340px;
}


[data-theme="dark"] {
--bg: #0f1722;
--panel: #1a2433;
--text: #e8eef6;
--muted: #8a98a8;
--accent: #4aa8f0;
--shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}


* { box-sizing: border-box; margin: 0; padding: 0; }


body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  transition: background 0.4s ease, color 0.4s ease;
  overflow-x: hidden;
}


/* ============ TOP BAR ============ */
.topbar {
  width: 100%;
  max-width: 1400px;
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}


.search {
  flex: 1 1 280px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border-radius: var(--radius);
  padding: 11px 16px;
  box-shadow: var(--shadow);
  min-width: 200px;
}
.search svg { flex-shrink: 0; color: var(--muted); }
.search input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: 15px;
  color: var(--text);
  font-family: inherit;
}
.search input::placeholder { color: var(--muted); }
.search .voice {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--accent);
  display: grid; place-items: center;
  cursor: pointer;
  border: none;
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.search .voice:hover { transform: scale(1.08); }
.search .voice svg { color: #fff; }


.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  background: var(--panel);
  color: var(--text);
  border: none;
  border-radius: var(--radius);
  padding: 11px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 7px;
  transition: transform 0.15s ease, background 0.3s ease;
  font-family: inherit;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); }
.btn.active { background: var(--accent); color: #fff; }
.btn svg { width: 17px; height: 17px; }


/* ============ MAP ============ */
.map-wrap {
  position: relative;
  width: 100%;
  max-width: 1500px;
  aspect-ratio: 16 / 10;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow);
  background: transparent;
}
[data-theme="dark"] .map-wrap { background: #0a121c; }


.map-wrap svg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
.map-wrap svg:active { cursor: grabbing; }


/* ===== Interactive buildings ===== */
.building {
  cursor: pointer;
  transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
              filter 0.32s ease;
  transform-box: fill-box;
  transform-origin: center bottom;
}


.building:hover {
  transform: scale(1.05) translateY(-8px);
  filter: brightness(1.18) 
drop-shadow(0 10px 18px rgba(46, 143, 224, 0.45))
drop-shadow(0 0 12px rgba(46, 143, 224, 0.35));
}


.building.highlight {
  filter: brightness(1.25) drop-shadow(0 0 18px rgba(46, 143, 224, 0.85));
  animation: pulse-highlight 1.4s ease-in-out infinite;
}


@keyframes pulse-highlight {
  0%, 100% { filter: brightness(1.2) drop-shadow(0 0 14px rgba(46, 143, 224, 0.7)); }
  50% { filter: brightness(1.35) drop-shadow(0 0 22px rgba(46, 143, 224, 1)); }
}


/* Weather & night */
.weather {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.weather.on { opacity: 1; }


.rain span {
  position: absolute;
  top: -20%;
  width: 2px;
  height: 18px;
  background: linear-gradient(to bottom, transparent, rgba(140, 190, 230, 0.75));
  border-radius: 2px;
  animation: fall linear infinite;
}
@keyframes fall {
  0%   { transform: translateY(-100vh) translateX(0); }
  100% { transform: translateY(120vh) translateX(-60px); }
}


.snow span {
  position: absolute;
  top: -10%;
  width: 7px;
  height: 7px;
  background: #ffffff;
  border-radius: 50%;
  opacity: 0.85;
  filter: blur(0.4px);
  animation: snow-fall linear infinite;
}
@keyframes snow-fall {
  0%   { transform: translateY(-100vh) translateX(0) rotate(0deg); }
  100% { transform: translateY(120vh) translateX(40px) rotate(360deg); }
}


.night-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10, 20, 40, 0.55), rgba(5, 12, 25, 0.7));
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
  mix-blend-mode: multiply;
}
[data-theme="dark"] .night-overlay { opacity: 1; }
[data-theme="dark"] .map-wrap svg { filter: brightness(0.88) saturate(1.12); }


/* Animations */
@keyframes twinkle { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
@keyframes pulse   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes drive   { 0% { transform: translate(0,0); } 100% { transform: translate(280px,140px); } }


.tw    { animation: twinkle 2.4s ease-in-out infinite; }
.pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.bus   { animation: drive 12s linear infinite; }


/* ============ INFO PANEL ============ */
.info-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: var(--panel-w);
  max-width: 100%;
  height: 100%;
  background: var(--panel);
  box-shadow: -12px 0 40px rgba(0,0,0,0.18);
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 100;
  display: flex;
  flex-direction: column;
  padding: 28px 24px;
  overflow-y: auto;
}
.info-panel.open { transform: translateX(0); }


.info-panel .close {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 24px;
  cursor: pointer;
  border-radius: 50%;
  display: grid;
  place-items: center;
  transition: background 0.2s, color 0.2s;
}
.info-panel .close:hover { background: rgba(0,0,0,0.06); color: var(--text); }


.info-panel .tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.info-panel h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 10px;
  line-height: 1.25;
}
.info-panel p {
  font-size: 15px;
  line-height: 1.55;
  color: var(--muted);
  margin-bottom: 20px;
}
.info-panel .meta {
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
  padding-top: 16px;
}


.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 90;
}
.backdrop.show { opacity: 1; pointer-events: auto; }


@media (max-width: 640px) {
body { padding: 12px; }
.search { padding: 10px 14px; }
.btn { padding: 10px 12px; font-size: 13px; }
.btn span { display: none; }
.info-panel { width: 100%; }
}
</style>

    <p id="panelDesc">Description goes here.</p>
    <div class="meta" id="panelMeta">Click any building on the map to explore.</div>
  </div>


<script>
const body = document.body;
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
const next = body.dataset.theme === 'dark' ? 'light' : 'dark';
body.dataset.theme = next;
themeBtn.classList.toggle('active', next === 'dark');
});


const rainLayer = document.getElementById('rainLayer');
const rainBtn = document.getElementById('rainBtn');
const snowBtn = document.getElementById('snowBtn');
const snowLayer = document.getElementById('snowLayer');


for (let i = 0; i < 120; i++) {
const d = document.createElement('span');
d.style.left = Math.random() * 100 + '%';
d.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
d.style.animationDelay = (Math.random() * 2) + 's';
d.style.opacity = 0.4 + Math.random() * 0.5;
rainLayer.appendChild(d);
}
for (let i = 0; i < 80; i++) {
const f = document.createElement('span');
f.style.left = Math.random() * 100 + '%';
f.style.animationDuration = (4 + Math.random() * 4) + 's';
f.style.animationDelay = (Math.random() * 5) + 's';
f.style.width = f.style.height = (4 + Math.random() * 5) + 'px';
f.style.opacity = 0.5 + Math.random() * 0.5;
snowLayer.appendChild(f);
}


rainBtn.addEventListener('click', () => {
const on = rainLayer.classList.toggle('on');
rainBtn.classList.toggle('active', on);
if (on) { snowLayer.classList.remove('on'); snowBtn.classList.remove('active'); }
});
snowBtn.addEventListener('click', () => {
const on = snowLayer.classList.toggle('on');
snowBtn.classList.toggle('active', on);
if (on) { rainLayer.classList.remove('on'); rainBtn.classList.remove('active'); }
});


document.querySelector('.voice').addEventListener('click', function () {
this.style.background = '#e8392f';
setTimeout(() => { this.style.background = ''; }, 600);
});


/* ===== Clickable buildings ===== */
const panel = document.getElementById('infoPanel');
const backdrop = document.getElementById('backdrop');
const closeBtn = document.getElementById('closePanel');
const panelTag = document.getElementById('panelTag');
const panelTitle = document.getElementById('panelTitle');
const panelDesc = document.getElementById('panelDesc');
const panelMeta = document.getElementById('panelMeta');


function openPanel(el) {
panelTag.textContent = el.dataset.type || 'Place';
panelTitle.textContent = el.dataset.name || 'Unknown';
panelDesc.textContent = el.dataset.desc || '';
panelMeta.textContent = 'Click another building or press Esc to close';
panel.classList.add('open');
backdrop.classList.add('show');
}


function closePanel() {
panel.classList.remove('open');
backdrop.classList.remove('show');
}


document.querySelectorAll('.building').forEach(b => {
b.addEventListener('click', (e) => {
e.stopPropagation();
openPanel(b);
  });
});


closeBtn.addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', (e) => {
if (e.key === 'Escape') closePanel();
});


/* ===== Search ===== */
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
const q = searchInput.value.trim().toLowerCase();
document.querySelectorAll('.building').forEach(b => {
const name = (b.dataset.name || '').toLowerCase();
const type = (b.dataset.type || '').toLowerCase();
const id = (b.dataset.id || '').toLowerCase();
const match = !q || name.includes(q) || type.includes(q) || id.includes(q);
b.classList.toggle('highlight', match && q.length > 0);
b.style.opacity = match ? '1' : '0.35';
  });
});
searchInput.addEventListener('keydown', (e) => {
if (e.key === 'Enter') {
const first = document.querySelector('.building.highlight');
if (first) openPanel(first);
  }
});
</script>
